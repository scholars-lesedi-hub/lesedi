<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Education Lesedi</title>
<style>body{font-family:Arial;margin:0;background:#f5f5f5}.topbar{background:#000;color:#fff;padding:12px;text-align:center}.hero{background:#ffcc00;padding:20px;text-align:center}.card{background:#fff;margin:10px;padding:15px;border-radius:10px}.btn{background:#000;color:#fff;padding:12px;width:100%;border:none;border-radius:8px;font-weight:bold}input{width:95%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:6px}#myBox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:99}.box{background:#fff;margin:40px auto;padding:20px;width:90%;max-width:400px;border-radius:12px}</style>
</head><body>
<div class="topbar">Education Lesedi Dumela • Capital of Botswana</div>
<div class="hero"><h2>Education Lesedi Dumela</h2><p>UPLOAD PAPERS • All Schools • BGCSE • JCE</p><button onclick="openLogin()" style="background:#000;color:#fff;padding:10px 20px;border-radius:8px">LOGIN / SIGNUP</button></div>
<div class="card"><h3>📤 UPLOAD PAPERS</h3><input type="file" id="pdfFile"><button class="btn" onclick="alert('Upload working!')">UPLOAD & MARK</button></div>
<div class="card"><h3>📝 Exam - Composition + Essay</h3><p>Choose subject, upload, get marking.</p></div>

<div id="myBox"><div class="box">
<h3>Dumela! Sign Up</h3>
<input id="phone" placeholder="+267 7XXXXXXX">
<input id="n1" placeholder="Full Name - Tiro">
<input id="t1" placeholder="Town - Gaborone">
<input id="s1" placeholder="School - All Schools">
<button class="btn" style="background:#f5b400;color:#000" onclick="getOtp()">SAVE & SIGNUP</button>
<p onclick="closeLogin()" style="text-align:center;cursor:pointer">Close</p>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let db=null;
try{ db=window.supabase.createClient("https://ajcsojkyhivjmomtufs.supabase.co","sb_publishable_1MwFadx6hG1R6bZ9xG0lRw_7L7xQ0xQ"); }catch(e){}

function openLogin(){ document.getElementById('myBox').style.display='block'; }
function closeLogin(){ document.getElementById('myBox').style.display='none'; }

async function getOtp(){
  let phone=document.getElementById('phone').value;
  let name=document.getElementById('n1').value;
  let town=document.getElementById('t1').value || "Gaborone";
  if(!phone || !name){ alert("Please enter phone and name"); return; }
  alert("Dumela "+name+"! Saving...");
  const { error } = await db.from('lesedi_users').insert([{phone: phone, full_name: name, town: town, school: 'All Schools', role: 'Student'}]);
  if(error){ alert("Error: "+error.message); }
  else{ alert("Dumela "+name+"! You are SAVED! Check Supabase lesedi_users"); closeLogin(); }
}
</script>
</body></html>
